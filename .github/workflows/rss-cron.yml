name: Automated RSS Ingestion Cron

on:
  schedule:
    # Runs every 60 minutes
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Rule Engine Pipeline via API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Cloudflare Worker is the production target; this fallback applies
          # only when the CRON_API_URL secret is not set on the repo.
          CRON_API_URL: ${{ secrets.CRON_API_URL || 'https://songbadchakra.songbadchakra.workers.dev' }}
        run: |
          echo "🚀 Triggering RSS ingestion via Rule Engine API..."
          HTTP_STATUS=$(curl \
            --silent \
            --output /tmp/cron_response.json \
            --write-out "%{http_code}" \
            --fail-with-body \
            --retry 3 \
            --retry-delay 15 \
            --retry-all-errors \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${CRON_API_URL}/api/cron/rss")
          echo "HTTP Status: ${HTTP_STATUS}"
          cat /tmp/cron_response.json || true
          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "❌ Cron API call failed with HTTP ${HTTP_STATUS}"
            exit 1
          fi
          echo "✅ RSS ingestion triggered successfully."
